services:
  # 1. MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: fastapi-week3-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: fastapi-week3-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. FastAPI 后端
  api:
    build: .
    container_name: fastapi-week3-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./uploads:/app/uploads

# 4. 声明持久化数据卷
volumes:
  mysql_data:
  redis_data: